name = "roadguard"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Nettoyage des signalements expirés et des positions anciennes.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "roadguard-eu"
database_id = "REMPLACE_PAR_LA_CI"
migrations_dir = "migrations"

# Applis à jour (APK en morceaux), écrites par la compilation automatique.
[[kv_namespaces]]
binding = "APPS"
id = "REMPLACE_KV_PAR_LA_CI"
