function home(){let c=state.community||{};return '<div class="page"><div class="home-head"><div class="shield"></div><div class="logo">ROAD<em>GUARD</em></div><div class="home-tag">PRÊT POUR LA ROUTE</div></div><div class="home-spacer"></div><div class="home-menu"><div class="home-intro">Où veux-tu aller ?</div>'+
 [['➤','Ouvrir la carte','GPS, recherche et conduite','Carte'],['◉','Radars et alertes','Voir les alertes et les bases','Alertes'],['⇩','Cartes hors connexion','Télécharger et gérer les pays','Hors ligne'],['⚙','Réglages','Carte, voix et alertes','Paramètres'],['♙','Mon compte',c.paired?'Compte connecté':'Se connecter','Compte']].map(x=>'<button class="home-link" onclick="call(\'screen\',\''+x[3]+'\')"><span class="glyph">'+x[0]+'</span><span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></span><span class="arr">›</span></button>').join('')+'</div><div class="home-foot"><span>●</span><span>GPS '+(state.gps?'Disponible':'En attente')+'</span><span style="margin-left:auto">'+(state.network?'En ligne':'Hors connexion')+'</span></div></div>';}
function actionButton(label,name,value,extra){return '<button class="quiet '+(extra||'')+'" onclick="call(\''+name+'\',\''+(value==null?'':value)+'\')">'+label+'</button>';}
function route(){let options=state.routeOptions||[];let rows=options.length?options.map((r,i)=>'<button class="choice '+(i===state.routeActive?'active':'')+'" onclick="call(\'routeOption\','+i+')"><span class="mark">'+(i===state.routeActive?'◉':'○')+'</span><span class="grow"><b>'+esc(r.label)+'</b><br><small class="muted">'+esc(r.summary)+'</small></span></button>').join(''):'<div class="choice"><span class="mark">⌁</span><span>'+(state.destination?'Prêt à calculer':'Choisis une destination')+'</span></div>';
 return '<div class="page">'+head('Itinéraire')+'<div class="content scrolly"><div class="form-label">DÉPART</div><button class="input" style="text-align:left" onclick="call(\'screen\',\'Carte\')">⌖ &nbsp; Ma position GPS <small class="muted">'+(state.gps?'· disponible':'· en attente')+'</small></button><div class="form-label">DESTINATION</div><button class="input" style="text-align:left" onclick="call(\'destination\',\'\')">⌕ &nbsp; '+esc(state.destination||'Où va-t-on ?')+'</button><div class="quick-actions">'+actionButton('Coordonnées','coordinates')+actionButton('♥ Favoris','screen','Favoris')+'</div><div class="route-choices">'+rows+'</div>'+(state.routeReady?'<div class="note">Trajet conservé sur le téléphone · '+esc(state.routeSummary||'')+'</div>':'<div class="note">Le calcul suit les routes et nécessite une connexion.</div>')+(state.destination?'<div class="quick-actions">'+actionButton('☆ Enregistrer','favoriteSave')+actionButton('↻ Recalculer','routeRecalculate')+'</div><div class="quick-actions">'+actionButton('Retirer la destination','destinationRemove')+(state.routeReady?actionButton('Arrêter le trajet','routeClear'):'')+'</div>':'')+settingRow('↻','Recalcul automatique','autoReroute','Si une sortie du trajet est confirmée')+actionButton('Journal GPS et export GPX','screen','Journal')+foot()+'</div><div class="bottom-cta"><button class="cta" '+(state.routePending?'disabled':'')+' onclick="call(\'routeStart\',\'\')">'+(state.routePending?'Calcul en cours…':state.routeReady?'Démarrer l’itinéraire':state.destination?'Calculer l’itinéraire':'Choisir une destination')+'</button></div></div>';}
const hazards=[['Radar fixe','fixed',''],['Radar mobile','mobile','yellow'],['Contrôle routier','control','yellow'],['Feu rouge','redlight',''],['Zone dangereuse','danger',''],['Accident','accident',''],['Véhicule arrêté','vehicle',''],['Bouchon','jam',''],['Obstacles','obstacle',''],['Travaux','works','']];
function report(){return '<div class="page report">'+head('Signaler')+'<div class="content scrolly"><div class="grid">'+hazards.map(([label,kind,cls])=>'<button class="tile '+cls+(selectedHazard===label?' active':'')+'" onclick="selectedHazard=\''+label+'\';render()"><span class="sym">'+reportIcon(kind)+'</span><span>'+label+'</span></button>').join('')+'</div><div class="space"></div><button class="tile '+(selectedHazard==='Autre'?'active':'')+'" style="width:34%;margin:auto" onclick="selectedHazard=\'Autre\';render()"><span class="sym">•••</span><span>Autre</span></button><p class="note">'+((state.community||{}).paired?'Partage communautaire disponible. ':'Connecte ton compte pour partager. ')+ ''+(state.reportLocationReady?'Position GPS précise disponible.':'Le marqueur nécessite un GPS récent et précis.')+'</p>'+foot()+'</div><div class="bottom-cta"><button class="cta" onclick="call(\'report\',selectedHazard)">'+((state.community||{}).paired?'Partager le signalement':'Continuer')+'</button></div></div>';}
function filteredRadars(){let list=(state.radars||[]).filter(r=>radarFilter==='all'||(radarFilter==='fixed'?!r.historical:r.historical));list=list.slice();if(radarSort==='az')list.sort((a,b)=>a.type.localeCompare(b.type,'fr'));else if(radarSort==='type')list.sort((a,b)=>a.kind.localeCompare(b.kind,'fr'));else list.sort((a,b)=>(a.meters==null?Infinity:a.meters)-(b.meters==null?Infinity:b.meters));return list;}
function radarList(){let list=filteredRadars();return list.length?list.slice(0,radarLimit).map(r=>'<button class="radar-row" onclick="call(\'radarDetail\','+r.index+')"><span class="icon">'+icon(r.kind)+'</span><span class="grow"><span class="type">'+esc(r.type)+'</span><br><span class="place">'+esc(r.place||'Point de la base radar')+'</span></span><span class="distance">'+esc(r.distance)+'</span></button>').join('')+(list.length>radarLimit?'<button class="more" onclick="radarLimit+=20;render()">Afficher les suivants ('+list.length+')</button>':''):'<div class="empty">'+(state.radarDirectionStatus||'Aucun radar correspondant dans ce secteur.')+'</div>';}
function radars(){return '<div class="page">'+head('Radars',true)+'<div class="content scrolly">'+actionButton('⇩ Installer / mettre à jour les radars','screen','Bases radar')+'<p class="note">'+esc(state.radarDirectionStatus||'')+'</p><div class="tabs">'+[['all','Tous'],['fixed','Fixes'],['mobile','Mobiles / lieux possibles']].map(x=>'<button class="pill '+(radarFilter===x[0]?'active':'')+'" onclick="radarFilter=\''+x[0]+'\';radarLimit=20;render()">'+x[1]+'</button>').join('')+'</div><div class="card" style="padding:2px 9px">'+radarList()+'</div><div class="note">🇫🇷 '+state.frCount+' points France · 🇨🇭 '+state.chCount+' points Suisse. Le GPS et le trajet filtrent les points quand le cap est fiable. Une route parallèle peut encore être confondue. Un lieu mobile ne confirme pas une présence actuelle.</div><div class="tabs"><button class="pill '+(radarSort==='distance'?'active':'')+'" onclick="radarSort=\'distance\';render()">Distance</button><button class="pill '+(radarSort==='az'?'active':'')+'" onclick="radarSort=\'az\';render()">A–Z</button><button class="pill '+(radarSort==='type'?'active':'')+'" onclick="radarSort=\'type\';render()">Type</button></div>'+foot()+'</div></div>';}
function toggle(on){return '<span aria-hidden="true" class="toggle '+(on?'on':'')+'"></span>';}
function radarBases(){let b=state.radarBases||{},c=state.community||{},fr=b.FR||{},ch=b.CH||{},extra=b.extra||[],busy=!!c.inventoryUpdating,checked=Number(c.inventoryChecked)||0;return '<div class="page">'+head('Bases radar')+actionButton('Ajouter ou importer des radars','screen','Gestion radars')+'<div class="content scrolly">'+(state.radarLoading?'<p class="note" role="status">'+esc(state.radarLoading)+'</p>':'')+'<div class="card" style="padding:15px"><b>France et Suisse déjà installées</b><p class="note">France : <strong>24 429 emplacements inclus</strong> · 7 325 permanents et 17 104 lieux historiques possibles. Ces derniers ne confirment pas une présence actuelle.</p>'+actionButton('Activer les 24 429 emplacements France','radarFranceFull')+'<p class="note">Les radars sont inclus dans ROADGUARD. Aucun fichier à chercher ni ZIP à importer pour démarrer.</p><div class="status-row"><span>🇫🇷 France</span><b>'+esc(fr.permanent||0)+' points permanents</b></div><div class="status-row"><span>🇨🇭 Suisse</span><b>'+esc(ch.permanent||0)+' points permanents</b></div><p class="note" role="status" aria-live="polite">'+esc(c.inventoryStatus||(checked?'Dernière vérification : '+new Date(checked).toLocaleString('fr-FR'):'Base embarquée incluse · vérification réseau en arrière-plan.'))+'</p><button class="cta" '+(busy?'disabled aria-busy="true"':'')+' onclick="call(\'radarUpdate\',\'\')">'+(busy?'Vérification en cours…':'Vérifier les mises à jour France + Suisse')+'</button><p class="note">Seule une nouvelle version est téléchargée. En cas de coupure, les bases déjà installées sont conservées.</p></div><div class="section-label">Pays voisins inclus hors connexion</div>'+(b.neighbors||[]).map(n=>'<div class="history-row"><b>'+esc(n.name)+'</b><small>'+esc(n.count)+' points inclus · relevé '+esc(n.snapshot)+(n.updated?' · mise à jour téléchargée : '+esc(n.updateCount)+' points':' · aucune mise à jour téléchargée')+'</small></div>').join('')+'<div class="section-label">Autres pays</div>'+actionButton('＋ Installer les radars d’un autre pays','radarCountries')+'<p class="note">Choisis le pays puis confirme le téléchargement. Aucune clé à saisir pour la source proposée. Les bases radar sont distinctes des cartes routières.</p>'+(extra.length?'<div class="section-label">Bases téléchargées sur ce téléphone</div>'+extra.map(r=>'<div class="history-row"><b>'+esc(r.name)+'</b><small>'+esc(r.count)+' points · '+(r.quarantined?'Source à vérifier, exclue des alertes':'Installés sur ce téléphone')+'</small></div>').join(''):'')+'<div class="section-label">Lieux mobiles et anciens signalements</div><p class="note">Ces emplacements connus ne confirment pas la présence actuelle d’un radar.</p><button class="switch-row" role="switch" aria-checked="'+(!!b.historyFr)+'" onclick="call(\'radarHistorical\',\'FR\')"><span class="grow">France · '+esc(fr.historical||0)+' lieux possibles</span>'+toggle(!!b.historyFr)+'</button><button class="switch-row" role="switch" aria-checked="'+(!!b.historyCh)+'" onclick="call(\'radarHistorical\',\'CH\')"><span class="grow">Suisse · '+esc(ch.historical||0)+' lieux possibles</span>'+toggle(!!b.historyCh)+'</button>'+actionButton('Sources et dates des bases','radarSources')+actionButton('Imports et réglages avancés','radarAdvanced')+actionButton('Couleurs, curseur et voix','screen','Apparence')+'</div></div>';}
function radarAlert(){let r=(state.radars||[])[state.alertIndex||0];if(!r)return radars();return '<div class="page">'+head('Alerte radar',true)+'<div class="content scrolly"><div class="radar-hero"><div class="radar-ring">'+icon(r.kind)+'</div><h2>'+esc(r.type)+'</h2><div class="radar-distance">'+esc(r.distance)+'</div><div>Contrôle de vitesse</div>'+(r.limit?'<div class="speed-sign">'+esc(r.limit)+'</div>':'')+'</div><div class="card radar-road"><b>'+esc(r.place||'Point radar')+'</b><br><span class="muted small">Coordonnées : '+esc(r.coords)+'</span></div>'+(r.sourceName?'<div class="note">Source : '+esc(r.sourceName)+'</div>':'')+(Number.isFinite(r.sourceDirection)?'<div class="note">Orientation fournie : '+esc(String(r.sourceDirection))+'°. Elle ne prouve pas le sens de circulation contrôlé.</div>':'')+(r.sourceReliability?'<div class="note">Qualification de la source : '+esc(r.sourceReliability.replace(/_/g,' '))+'</div>':'')+actionButton('Voir sur la carte','radarOnMap')+'<div class="note">Les données de la base indiquent un emplacement. Présence et limitation à vérifier sur place.</div></div><div class="bottom-cta"><button class="cta" onclick="call(\'radarSeen\',\'\')">✓ &nbsp; J’ai vu le radar</button></div></div>';}
function offline(){return '<div class="page">'+head('Cartes hors connexion')+'<div class="content scrolly"><div class="offline-hero"><div class="offline-icon">⇩</div><div><b>Emporte tes cartes</b><p>Choisis la France complète ou d’autres pays. Les cartes installées restent disponibles sans réseau et s’affichent ensemble.</p></div></div>'+actionButton('Choisir les cartes à télécharger','offlineMapDownloads')+(state.mapTransfer?'<div class="download-progress" role="status">↧ '+esc(state.mapTransfer)+'<small>Le téléchargement continue en arrière-plan.</small></div>':'')+'<div class="section-label">État de la carte</div><div class="status-row"><span>Réseau</span><strong class="'+(state.network?'state-ok':'state-muted')+'">'+(state.network?'Connecté':'Hors connexion')+'</strong></div><div class="status-row"><span>Tuiles déjà en cache</span><strong>'+(state.cacheFiles||0)+'</strong></div><p class="note">Le cache garde les zones déjà vues. Pour disposer d’un pays entier sans réseau, télécharge sa carte ci-dessus.</p><button class="quiet" onclick="call(\'retryMapTiles\',\'\')">Réessayer les tuiles manquantes</button><details class="advanced-fold"><summary>Détails du cache</summary><div class="card cache-card"><div class="cache-number">'+(state.cacheFiles||0)+' <small>tuiles</small></div><div class="muted">'+(state.cacheMb||0)+' Mo conservés · limite '+((state.cacheLimitMb||4096)/1024)+' Go</div><div class="cache-stats"><span>'+(state.cacheHits||0)+'<small>lectures locales</small></span><span>'+(state.cacheDownloads||0)+'<small>tuiles reçues</small></span></div></div><p class="note">'+(state.cacheAttempts||0)+' tentatives réseau · '+(state.cacheErrors||0)+' échecs · réserve de '+(state.cacheReserveMb||512)+' Mo libres.</p>'+((state.cacheLastError||'')?'<p class="note">'+esc(state.cacheLastError)+'</p>':'')+'<p class="note">'+(state.savedRoute?'Dernier itinéraire conservé':'Aucun itinéraire calculé conservé')+'</p>'+foot()+'</details></div><div class="bottom-cta"><button class="cta" onclick="call(\'screen\',\'Carte\')">Ouvrir la carte</button></div></div>';}
function androidAuto(){return '<div class="page">'+head('Android Auto')+'<div class="content scrolly"><div class="card" style="padding:16px"><b>ROADGUARD sur l’écran de la voiture</b><p>Carte, trajet enregistré, favoris, indications de guidage et alertes à proximité.</p><p class="note">Prépare tes favoris sur le téléphone et autorise le GPS précis. Les couleurs, le curseur et la correction de vitesse sont repris.</p></div><div class="section-label">Installation de test</div><p class="note">La connexion au véhicule nécessite une installation approuvée via Google Play (partage interne ou piste de test). Une APK installée directement peut ne pas apparaître dans Android Auto. Aucun essai sur véhicule ni certification Google Play n’a encore été réalisé.</p>'+actionButton('Préparer mes favoris','screen','Favoris')+actionButton('GPS et correction de vitesse','gpsSettings')+actionButton('Couleurs, curseur et voix','screen','Apparence')+'<p class="note">Les cartes déjà consultées utilisent le cache disponible. De nouvelles tuiles et un nouveau calcul d’itinéraire nécessitent une connexion. Le partage communautaire de position reste géré sur le téléphone.</p></div></div>';}
function settingRow(icon,title,key,detail){const v=state.settings||{};const on=!!v[key];return '<button class="switch-row" onclick="call(\'toggle\',\''+key+'\')"><span class="lead">'+icon+'</span><span class="grow">'+title+(detail?'<br><small class="muted">'+detail+'</small>':'')+'</span><span class="toggle '+(on?'on':'')+'"></span></button>';}
let settingsMoreOpen=false;
function settings(){return '<div class="page">'+head('Réglages')+actionButton(state.updateVersion?'Mise à jour disponible · '+esc(state.updateVersion):'Mises à jour de l’application','appUpdate')+'<div class="content scrolly"><div class="settings-intro">Personnalise l’essentiel pour ta conduite. Les outils moins utilisés se trouvent dans « Plus d’options ».</div><div class="section-label">Alertes</div>'
 +settingRow('⚠','Alertes radar','radar','Radars probables devant toi')
 +settingRow('♪','Annonces vocales','voice','Alertes et distances')
 +settingRow('!','Annonce de dépassement','overspeedVoice','Limitation connue uniquement')
 +settingRow('◉','Alertes écran éteint','background','Notification de suivi GPS')
 +actionButton('Télécharger des radars par pays','radarCountries')
 +actionButton('Gérer les bases et mises à jour','screen','Bases radar')
 +'<div class="section-label">Carte</div>'
 +settingRow('◐','Mode nuit','night','Carte sombre')
 +actionButton('Choisir la voix française','voiceChoose')
 +actionButton('Couleurs et apparence de la carte','screen','Apparence')
 +actionButton('Télécharger une carte maintenant','offlineMapDownloads')
 +actionButton('Gérer les cartes hors connexion','screen','Hors ligne')
 +'<div class="section-label">Compte</div>'
 +actionButton('Mon compte','screen','Compte')
 +'<button class="quiet settings-more" aria-expanded="'+settingsMoreOpen+'" onclick="settingsMoreOpen=!settingsMoreOpen;render()">'+(settingsMoreOpen?'⌃ Masquer les options':'⌄ Plus d’options')+'</button>'
 +(settingsMoreOpen?'<div class="section-label">Navigation et GPS</div><div class="status-row"><span>⌖ Position GPS</span><span class="muted">'+(state.gps?'Disponible':'En attente')+'</span></div>'
 +settingRow('▦','Partager les cartes installées avec DRIVE','phoneMaps','Avec le partage du trajet activé : autorise la copie des tuiles des packs installés vers ton poste associé. Sans téléchargement Internet par ce partage. DRIVE conserve au plus 32 Mio et 512 tuiles pendant 24 h pour les coupures. Efface la copie depuis DRIVE pour la retirer immédiatement.')
 +settingRow('⇄','Partager le trajet avec Compagnon','phoneGuidance','Partage le tracé et les consignes avec DRIVE, avec une commande d’arrêt. Active le guidage ROADGUARD dans Compagnon. La liaison directe utilise les deux applications à jour ; les notifications servent de secours avec les anciennes versions. Active aussi « Alertes écran éteint » pour continuer en arrière-plan.')
 +settingRow('↗','Guidage vocal','guidance','Indications de direction')
 +settingRow('↻','Recalcul automatique','autoReroute','Après une sortie du trajet')
 +actionButton('GPS et précision de direction','gpsSettings')
 +'<div class="section-label">Outils</div>'
 +actionButton('Communauté et signalements','screen','Communauté')
 +actionButton('Notifications Android','notificationSettings')
 +actionButton('Musique et égaliseur','spotify')
 +actionButton('Journal GPS et export','screen','Journal')
 +actionButton('Mes signalements','screen','Historique')
 +actionButton('Contrôles mémorisés','controlMemory')
 +actionButton('Android Auto','screen','Android Auto')
 +foot():'')+'<p class="note">ROADGUARD '+esc(state.version||'')+'</p></div></div>';}
function appearance(){let c=state.community||{},a=c.appearance||{},accent=a.accent||'#ff304f',cursor=a.cursor||'arrow',route=a.routeColor||'#329dff';let paletteCards='<div class="map-palette">'+[['graphite','Graphite'],['readable','Lisibilité'],['original','Couleurs OSM'],['ocean','Océan'],['emerald','Émeraude'],['amber','Ambre']].flatMap(([pack,label])=>['day','night'].map(mode=>`<button class="map-palette-card ${!state.auto&&(state.mapPack||'graphite')===pack&&!!state.night===(mode==='night')?'active':''}" onclick="call('mapPalette','${pack}:${mode}')"><span class="map-palette-preview ${pack} ${mode}"></span><strong>${label}</strong><small>${mode==='night'?'Nuit':'Jour'}</small></button>`)).join('')+'</div>';return '<div class="page">'+head('Apparence')+'<div class="content scrolly"><div class="section-label">Pack graphique local</div>'+paletteCards+'<button class="color-free" onclick="call(&#39;mapColors&#39;)">Personnaliser les couleurs de la carte</button><p class="note">Chaque style existe en Jour et en Nuit. Le choix s’applique aux tuiles visibles, sans télécharger de nouvelles cartes ; les cartes téléchargées passent en priorité et le réseau complète les zones manquantes.</p><button class="pill '+(state.auto?'active':'')+'" onclick="call(\'theme\',\'auto\')">Mode automatique selon le téléphone</button><div class="section-label">Couleur de l’interface et du curseur</div><div class="swatches">'+['#ff304f','#329dff','#ff942e','#1acb91','#a575ff','#e5c36b'].map((color,i)=>'<button aria-label="Couleur '+(i+1)+'" class="swatch '+(accent===color?'active':'')+'" style="background:'+color+'" onclick="call(\'accent\',\''+color+'\')"></button>').join('')+'</div><button class="color-free" onclick="openPalette(&#39;accent&#39;)" aria-label="Ouvrir la palette de l’interface et du curseur"><span class="color-free-chip" style="background:'+esc(accent)+'"></span><span>Palette complète · interface et curseur</span></button><div class="section-label">Curseur GPS</div><p class="note">La flèche ou la voiture remplace le point. Le cercle de précision utilise la couleur choisie.</p><div class="tabs">'+[['arrow','➤ Flèche'],['car','▰ Voiture'],['dot','● Point']].map(([id,label])=>'<button class="pill '+(cursor===id?'active':'')+'" onclick="call(\'cursor\',\''+id+'\')">'+label+'</button>').join('')+'</div><div class="section-label">Couleur de l’itinéraire</div><div class="swatches">'+['#329dff','#ff304f','#1acb91','#a575ff'].map((color,i)=>'<button aria-label="Couleur du tracé '+(i+1)+'" class="swatch '+(route===color?'active':'')+'" style="background:'+color+'" onclick="call(\'routeColor\',\''+color+'\')"></button>').join('')+'</div><button class="color-free" onclick="openPalette(&#39;routeColor&#39;)" aria-label="Ouvrir la palette de l’itinéraire"><span class="color-free-chip" style="background:'+esc(route)+'"></span><span>Palette complète · itinéraire</span></button>'+actionButton((a.menuPhoto!==false?'✓ ':'')+'Fond illustré du menu','menuPhoto')+actionButton('Voix : '+esc(c.voice||'Voix française de l’appareil'),'voiceChoose')+actionButton('Régler le débit et la hauteur de la voix','voiceTune')+settingRow('◐','Contraste renforcé','contrast','Lisibilité des routes')+settingRow('◎','Radars sur la carte','markers','Alertes GPS conservées')+settingRow('↗','Suivre la route','heading','Orientation du GPS')+settingRow('⌕','Zoom adaptatif','zoom','Selon la vitesse')+settingRow('↑','Anticipation du trajet','ahead','Davantage de route devant le véhicule')+'<p class="note">'+(c.paired?'Couleurs et curseur synchronisés avec ton compte.':'Préférences conservées sur ce téléphone.')+' Les voix dépendent de chaque appareil.</p></div></div>';}
function account(){let c=state.community||{},connected=!!c.paired;return '<div class="page">'+(connected?head('Mon compte'):'<div class="top"><h1>ROADGUARD · Connexion</h1></div>')+'<div class="content scrolly"><div class="account-hero"><span class="account-symbol">♙</span><div><small>ROADGUARD · MON COMPTE</small><h2>'+(connected?'Tu es connecté':'Bienvenue sur ROADGUARD')+'</h2><p>'+(connected?'La carte et tes signalements sont disponibles.':'Connecte-toi ici pour accéder à la carte, aux radars et aux signalements.')+'</p></div></div><div class="account-state">'+(connected?'● Compte connecté'+(c.unlimited?' · accès illimité':''):'○ Connexion requise')+'</div>'+(connected?'<div class="section-label">Mon compte</div>'+actionButton('Voir mes signalements','screen','Communauté')+actionButton('Gérer les numéros autorisés','communityAdmin')+actionButton('Déconnecter ce téléphone','communityDisconnect'):'<div class="section-label">Directement dans l’application</div><p class="note">Saisis ton numéro au format international et ton mot de passe. Si c’est ta première fois, crée un compte depuis le même bouton. Aucun navigateur ni SMS.</p><button class="cta account-cta" onclick="call(\'communityLink\',\'\')">Se connecter ou créer mon compte</button><p class="note">Le numéro déclaré n’est pas vérifié par un opérateur. Conserve ton mot de passe : la récupération automatique n’est pas disponible. Après connexion, les cartes téléchargées restent accessibles sans réseau.</p>'+(c.status&&c.status!=='Données communautaires en attente'?'<p class="note" role="status">'+esc(c.status)+'</p>':''))+'</div></div>';}
function community(){let c=state.community||{},reports=c.reports||[],own=c.own||[],now=Date.now();return '<div class="page">'+head('Communauté')+'<div class="content scrolly"><div class="card" style="padding:16px"><b>'+esc(c.paired?'Compte ROADGUARD connecté':c.pending?'Vérification en cours':'La route, ensemble')+'</b><p class="note">'+esc(c.status||'Données en attente')+(c.paired&&c.unlimited?' · Accès illimité':'')+'</p>'+(!c.paired?actionButton('Se connecter ou créer mon compte','screen','Compte'):actionButton('Déconnecter ce téléphone','communityDisconnect'))+'</div><div class="section-label">Ma visibilité</div><p class="note">'+(c.expires>now?'Position visible jusqu’à '+esc(new Date(c.expires).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})):'Ta position est privée.')+' Position approximative, actualisée toutes les 10 minutes avec ton accord. Elle disparaît après 20 minutes sans mise à jour.</p>'+actionButton(c.sharing||c.expires>now?'Masquer ma position':'Activer ma visibilité','communityPresence')+actionButton((c.showMembers?'✓ ':'')+'Voir les membres sur la carte','communityMembers')+'<p class="note">'+esc(c.memberCount||0)+' membre(s) visible(s) dans la zone · les groupes se détaillent en zoomant.</p>'+actionButton('Actualiser les données','communitySync')+'<div class="section-label">Signalements du secteur</div>'+(reports.length?reports.map(r=>'<div class="history-row"><b>'+esc(communityLabel(r.kind))+'</b><small>'+esc(r.reporterName?'Signalé par '+r.reporterName:(r.note||'Signalé par un membre ROADGUARD'))+' · '+esc(new Date(r.created).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}))+'</small><div class="quick-actions">'+actionButton('✓ Vu','communityVote',r.id+':seen')+actionButton('Absent','communityVote',r.id+':gone')+actionButton('Abus','communityVote',r.id+':flag')+'</div></div>').join(''):'<p class="note">Aucun signalement actif téléchargé dans ce secteur.</p>')+'<div class="section-label">Mes contributions partagées</div>'+(own.length?own.map(r=>'<div class="history-row"><b>'+esc(communityLabel(r.kind))+'</b><small>'+esc(r.status==='deleted'?'Retiré':r.status==='review'?'Masqué pour vérification':r.expires<=now?'Expiré':'Actif')+'</small>'+(r.status!=='deleted'?actionButton('Retirer','communityDelete',r.id):'')+'</div>').join(''):'<p class="note">'+(c.paired?'Aucune contribution partagée.':'Connecte ton compte pour retrouver tes contributions.')+'</p>')+'<p class="note">Le téléchargement porte sur les alertes et l’inventaire radar, pas sur une carte de pays.</p></div></div>';}
function communityLabel(kind){return ({fixed:'Radar fixe',mobile:'Radar mobile',control:'Contrôle routier',redlight:'Feu rouge',danger:'Zone dangereuse',accident:'Accident',stopped:'Véhicule arrêté',traffic:'Bouchon',obstacle:'Obstacle',works:'Travaux',other:'Autre'})[kind]||'Signalement';}

function favorites(){let list=state.favorites||[];return '<div class="page">'+head('Mes lieux favoris')+'<div class="content scrolly">'+(list.length?list.map(f=>'<div class="favorite-row"><button class="favorite-main" onclick="call(\'favoriteChoose\','+f.index+')"><b>♥ &nbsp; '+esc(f.name)+'</b><small>'+esc(f.coords)+'</small></button><button class="delete" aria-label="Supprimer '+esc(f.name)+'" onclick="call(\'favoriteDelete\','+f.index+')">×</button></div>').join(''):'<div class="empty"><div class="empty-symbol">♡</div><b>Tes lieux, à portée de main</b><p>Choisis une destination puis enregistre-la en favori.</p>'+actionButton('Choisir une destination','destination')+'</div>')+'</div></div>';}
function history(){let entries=String(state.reports||'').split('\n').filter(Boolean);return '<div class="page">'+head('Mes signalements')+actionButton('Contrôles mémorisés · temporaires et permanents','controlMemory')+'<div class="content scrolly"><p class="note">Historique privé sur ce téléphone · '+entries.length+' entrée(s)</p>'+(entries.length?entries.map(e=>{let f=e.split(' • ');return '<div class="history-row"><b>'+esc(f[0])+'</b><small>'+esc(f.slice(1).join(' · '))+'</small></div>';}).join('')+actionButton('Exporter en CSV','reportsExport')+actionButton('Effacer les signalements','reportsClear'):'<div class="empty">Aucun signalement pour le moment.</div>')+'</div><div class="bottom-cta"><button class="cta" onclick="call(\'screen\',\'Signaler\')">Ajouter un signalement</button></div></div>';}
function journal(){return '<div class="page">'+head('Journal GPS')+'<div class="content scrolly"><div class="card cache-card"><div class="cache-number">'+esc(state.tripDistance||'0,00 km')+'</div><p class="muted">'+(state.tripSamples||0)+' positions enregistrées</p><div class="pill '+(state.recording?'active':'')+'">'+(state.recording?'ENREGISTREMENT ACTIF':'ENREGISTREMENT EN PAUSE')+'</div></div><p class="note">Le journal enregistre le parcours lorsque ROADGUARD est ouvert et reçoit une position GPS.</p>'+actionButton(state.recording?'Mettre en pause':'Enregistrer mon parcours','tripToggle')+((state.tripSamples||0)>0?actionButton('Exporter le parcours en GPX','tripExport'):'')+'</div></div>';}

let paletteKind='',paletteH=0,paletteS=0,paletteV=0,paletteTrigger=null;
function paletteRgb(hex){let n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function paletteFromHex(hex){let [r,g,b]=paletteRgb(hex).map(n=>n/255),max=Math.max(r,g,b),min=Math.min(r,g,b),delta=max-min,h=0;if(delta){if(max===r)h=((g-b)/delta)%6;else if(max===g)h=(b-r)/delta+2;else h=(r-g)/delta+4;h=(h*60+360)%360;}paletteH=Math.round(h);paletteS=max?Math.round(delta/max*100):0;paletteV=Math.round(max*100);}
function paletteHex(){let h=paletteH,s=paletteS/100,v=paletteV/100,c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return '#'+[r,g,b].map(n=>Math.round((n+m)*255).toString(16).padStart(2,'0')).join('');}
function paletteUpdate(){let hex=paletteHex(),sample=document.getElementById('palette-sample'),entry=document.getElementById('palette-hex'),sat=document.getElementById('palette-sat'),val=document.getElementById('palette-val');if(!sample)return;sample.style.background=hex;entry.value=hex;entry.style.borderColor='#638098';sat.style.background='linear-gradient(to right,#fff,hsl('+paletteH+' 100% 50%))';val.style.background='linear-gradient(to right,#000,hsl('+paletteH+' '+paletteS+'% 50%))';}
function paletteSlider(which,value){let n=Number(value);if(which==='h')paletteH=n;else if(which==='s')paletteS=n;else paletteV=n;paletteUpdate();}
function paletteHexInput(value){if(!/^#[0-9a-f]{6}$/i.test(value)){document.getElementById('palette-hex').style.borderColor='#ff6379';return;}paletteFromHex(value);document.getElementById('palette-hue').value=paletteH;document.getElementById('palette-sat').value=paletteS;document.getElementById('palette-val').value=paletteV;paletteUpdate();}
function closePalette(save){let overlay=document.getElementById('palette-overlay'),kind=paletteKind,hex=paletteHex();if(overlay)overlay.remove();paletteKind='';if(save)call(kind,hex);else if(paletteTrigger&&document.contains(paletteTrigger))paletteTrigger.focus();paletteTrigger=null;}
function openPalette(kind){if(kind!=='accent'&&kind!=='routeColor')return;let appearance=((state.community||{}).appearance||{}),hex=kind==='accent'?(appearance.accent||'#ff304f'):(appearance.routeColor||'#329dff');if(!/^#[0-9a-f]{6}$/i.test(hex))hex='#ff304f';paletteKind=kind;paletteTrigger=document.activeElement;paletteFromHex(hex);let overlay=document.createElement('div');overlay.id='palette-overlay';overlay.className='palette-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','Sélectionner une couleur');overlay.innerHTML='<div class="palette-panel"><h2 class="palette-title">Sélectionner une couleur</h2><label class="palette-field">Teinte<input id="palette-hue" type="range" min="0" max="360" value="'+paletteH+'" oninput="paletteSlider(&#39;h&#39;,this.value)" style="background:linear-gradient(to right,red,yellow,lime,cyan,blue,magenta,red)"></label><label class="palette-field">Saturation<input id="palette-sat" type="range" min="0" max="100" value="'+paletteS+'" oninput="paletteSlider(&#39;s&#39;,this.value)"></label><label class="palette-field">Luminosité<input id="palette-val" type="range" min="0" max="100" value="'+paletteV+'" oninput="paletteSlider(&#39;v&#39;,this.value)"></label><div class="palette-preview"><span id="palette-sample" class="palette-sample" aria-label="Aperçu de la couleur"></span><input id="palette-hex" class="palette-hex" type="text" maxlength="7" aria-label="Code couleur hexadécimal" oninput="paletteHexInput(this.value)"></div><div class="palette-actions"><button type="button" onclick="closePalette(false)">Annuler</button><button type="button" class="palette-apply" onclick="closePalette(true)">Définir</button></div></div>';document.body.appendChild(overlay);paletteUpdate();document.getElementById('palette-hue').focus();}
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&paletteKind)closePalette(false);});

function render(){const color=((state.community||{}).appearance||{}).accent;if(/^#[0-9a-f]{6}$/i.test(color||'')){document.documentElement.style.setProperty('--accent',color);document.documentElement.style.setProperty('--accent-soft',color+'44');}let app=document.getElementById('app');app.className=state.screen==='Accueil'?(((state.community||{}).appearance||{}).menuPhoto===false?'home home-solid':'home'):'';app.innerHTML=({'Accueil':home,'Trajet':route,'Signaler':report,'Alertes':radars,'Radar':radarAlert,'Hors ligne':offline,'Paramètres':settings,'Apparence':appearance,'Favoris':favorites,'Historique':history,'Journal':journal,'Communauté':community,'Compte':account,'Bases radar':radarBases,'Android Auto':androidAuto}[state.screen]||home)();}
window.roadguardUpdate=function(payload){try{let panel=document.querySelector('.content.scrolly'),scroll=panel?panel.scrollTop:0,screen=state.screen;state=typeof payload==='string'?JSON.parse(payload):payload;render();panel=document.querySelector('.content.scrolly');if(panel&&screen===state.screen)panel.scrollTop=scroll;}catch(e){document.getElementById('app').textContent='Interface indisponible';}};
render();
</script></body></html>
