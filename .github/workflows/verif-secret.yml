name: Vérif secrets
on: { push: { branches: [verif-secret] } }
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Contrôle (aucune valeur affichée)
        env:
          P: ${{ secrets.RG_KEYS_PASSPHRASE }}
          K: ${{ secrets.KEYS_TGZ_ENC }}
          C: ${{ secrets.CLOUDFLARE_ENV_ENC }}
        run: |
          echo "RG_KEYS_PASSPHRASE longueur=${#P}"
          case "$P" in U2FsdGVk*) echo "RG_KEYS_PASSPHRASE = CONTENU DU FICHIER (écrasé)";; *) echo "RG_KEYS_PASSPHRASE = ressemble à un code";; esac
          echo "KEYS_TGZ_ENC longueur=${#K}"; echo "CLOUDFLARE_ENV_ENC longueur=${#C}"
          printf '%s' "$C" | base64 -d > c.enc 2>/dev/null && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in c.enc -pass env:P >/dev/null 2>&1 && echo "DÉCHIFFREMENT CLOUDFLARE AVEC LA PHRASE : OK" || echo "DÉCHIFFREMENT CLOUDFLARE AVEC LA PHRASE : ÉCHEC"
