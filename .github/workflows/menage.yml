name: Ménage

# Petite appli « Ménage » (tri des photos et fichiers) : compilée seule, sans recompiler Pilote, Drive et Suite.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["menage/**", ".github/workflows/menage.yml"]
  workflow_dispatch:

concurrency:
  group: menage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler la version finale signée
        working-directory: menage
        env:
          RG_KEYS_PASSPHRASE: ${{ secrets.RG_KEYS_PASSPHRASE }}
          KEYS_TGZ_ENC: ${{ secrets.KEYS_TGZ_ENC }}
          CLOUDFLARE_ENV_ENC: ${{ secrets.CLOUDFLARE_ENV_ENC }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          K="$RUNNER_TEMP/keys"
          if [ -n "$RG_KEYS_PASSPHRASE" ]; then
            mkdir -p "$K"
            if [ ! -f ../keys/keys.tgz.enc ] && [ -n "$KEYS_TGZ_ENC" ]; then mkdir -p "$(dirname ../keys/keys.tgz.enc)"; printf '%s' "$KEYS_TGZ_ENC" | base64 -d > ../keys/keys.tgz.enc; fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../keys/keys.tgz.enc -pass env:RG_KEYS_PASSPHRASE | tar -xzf - -C "$K"
            set -a; . "$K/keys.env"; set +a
            # Signée avec la clé de l'appli téléphone, comme Pilote Suite.
            export RG_KEYSTORE_FILE="$K/roadguard-gps.jks"
            export RG_KEYSTORE_PASSWORD="$GPS_KEYSTORE_PASSWORD" RG_KEY_PASSWORD="$GPS_KEY_PASSWORD" RG_KEY_ALIAS="$GPS_KEY_ALIAS"
          else
            echo "::warning::Secret RG_KEYS_PASSPHRASE absent : signature de test."
          fi
          ./gradlew --stacktrace :app:assembleRelease
          rm -rf "$K"
          mkdir -p ../dist
          f=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$f" "../dist/ROADGUARD-MENAGE-build${{ github.run_number }}.apk"
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: menage-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 3
      - name: Publier sur le serveur (lien /menage et Pilote Suite)
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          RG_KEYS_PASSPHRASE: ${{ secrets.RG_KEYS_PASSPHRASE }}
          KEYS_TGZ_ENC: ${{ secrets.KEYS_TGZ_ENC }}
          CLOUDFLARE_ENV_ENC: ${{ secrets.CLOUDFLARE_ENV_ENC }}
        run: |
          [ -n "$RG_KEYS_PASSPHRASE" ] || exit 0
          if [ ! -f keys/cloudflare.env.enc ] && [ -n "$CLOUDFLARE_ENV_ENC" ]; then mkdir -p "$(dirname keys/cloudflare.env.enc)"; printf '%s' "$CLOUDFLARE_ENV_ENC" | base64 -d > keys/cloudflare.env.enc; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keys/cloudflare.env.enc -pass env:RG_KEYS_PASSPHRASE > "$RUNNER_TEMP/cf.env"
          while IFS='=' read -r k v; do [ -n "$k" ] && echo "::add-mask::$v" && export "$k=$v"; done < "$RUNNER_TEMP/cf.env"
          rm -f "$RUNNER_TEMP/cf.env"
          python3 tools/ci/publish_updates.py dist "${{ github.run_number }}"
