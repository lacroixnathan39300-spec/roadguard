name: Essai émulateur

# Lancement manuel (onglet Actions → « Run workflow ») : coûte des minutes GitHub.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: drive
            api: 27
            target: default
            skin: 1024x600
            pkg: fr.roadguard.drive
            activity: fr.roadguard.drive.MainActivity
          - app: gps
            api: 34
            target: google_apis
            skin: 1080x2400
            pkg: fr.roadguard.gps
            activity: fr.roadguard.app.next.PhoneHomeActivity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Graphe routier embarqué
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p gps/app/src/main/assets/graphs
          gh release download graphs -R "${{ github.repository }}" -p 'graph-franche-comte.zip' -D gps/app/src/main/assets/graphs --clobber || true
      - name: Compiler pour l'émulateur (x86_64)
        working-directory: ${{ matrix.app }}
        run: chmod +x gradlew && ./gradlew :app:assembleDebug -Pemulator=true
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Essai
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin ${{ matrix.skin }}
          disable-animations: true
          script: |
            adb install -r -g $(ls ${{ matrix.app }}/app/build/outputs/apk/debug/*.apk | head -1)
            python3 tools/emulator/drive_sim.py ${{ matrix.pkg }} ${{ matrix.activity }} essai-${{ matrix.app }}
      - name: Publier les captures (branche essais)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ -d essai-${{ matrix.app }} ] || exit 0
          for i in 1 2 3 4 5; do
            rm -rf pub && git clone -q --depth 1 -b essais "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pub 2>/dev/null || (mkdir pub && cd pub && git init -q -b essais)
            rm -rf pub/${{ matrix.app }} && cp -r essai-${{ matrix.app }} pub/${{ matrix.app }}
            cd pub && git config user.name "ROADGUARD CI" && git config user.email "ci@roadguard.local"
            git add -A && git commit -qm "Essai ${{ matrix.app }} ${{ github.run_number }}" || true
            if git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" essais; then break; fi
            cd .. ; sleep 10
          done
