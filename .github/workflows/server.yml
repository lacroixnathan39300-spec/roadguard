name: Serveur communauté

on:
  push:
    branches: [main]
    paths: ["server/**", "tools/site/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Accès Cloudflare (chiffré dans le dépôt, déchiffré ici)
        env:
          RG_KEYS_PASSPHRASE: ${{ secrets.RG_KEYS_PASSPHRASE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -n "$RG_KEYS_PASSPHRASE" ] && [ -f ../keys/cloudflare.env.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../keys/cloudflare.env.enc -pass env:RG_KEYS_PASSPHRASE > "$RUNNER_TEMP/cf.env"
            while IFS='=' read -r k v; do [ -n "$k" ] && echo "::add-mask::$v" && echo "$k=$v" >> "$GITHUB_ENV"; done < "$RUNNER_TEMP/cf.env"
            rm -f "$RUNNER_TEMP/cf.env"
          fi
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Vérifications (types et règles)
        run: npx tsc -p . && npm test
      - name: Mise en ligne (Cloudflare)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : serveur non mis en ligne."; exit 0
          fi
          id=$(npx wrangler d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='roadguard-eu'),''))")
          if [ -z "$id" ]; then
            # Base en Europe de l'Ouest (proche des conducteurs).
            npx wrangler d1 create roadguard-eu --location weur
            id=$(npx wrangler d1 list --json | python3 -c "import json,sys; print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='roadguard-eu'))")
          fi
          sed -i "s/REMPLACE_PAR_LA_CI/$id/" wrangler.toml
          # Espace « APPS » (mises à jour des applis) : créé s'il n'existe pas.
          kv=$(npx wrangler kv namespace list | python3 -c "import json,sys; print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('APPS') or n['title']=='roadguard-apps'),''))")
          if [ -z "$kv" ]; then
            npx wrangler kv namespace create roadguard-apps || true
            kv=$(npx wrangler kv namespace list | python3 -c "import json,sys; print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('roadguard-apps') or n['title'].endswith('APPS')),''))")
          fi
          sed -i "s/REMPLACE_KV_PAR_LA_CI/$kv/" wrangler.toml
          npx wrangler d1 migrations apply roadguard-eu --remote
          # Adresse workers.dev du compte : créée si elle n'existe pas encore.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          if ! curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | grep -q '"subdomain":"'; then
            for name in roadguard-app roadguard-nathan roadguard-$(date +%s | tail -c 5); do
              if curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                   --data "{\"subdomain\":\"$name\"}" "$api"; then echo "Sous-domaine : $name"; break; fi
            done
          fi
          npx wrangler deploy
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")
          url="https://roadguard.$sub.workers.dev"
          echo "ADRESSE DU SERVEUR : $url"
          curl -fsS "$url/v1" | head -c 300; echo
          echo "### Serveur en ligne : $url" >> "$GITHUB_STEP_SUMMARY"
