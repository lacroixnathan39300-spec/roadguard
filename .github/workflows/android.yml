name: Android

permissions:
  contents: write

on:
  push:
    branches: [main]
    # Pas de compilation des applis pour un changement du serveur seul (économise les minutes GitHub).
    paths-ignore: ["menage/**", ".github/workflows/menage.yml", "server/**", ".github/workflows/server.yml", ".github/workflows/diag.yml", ".github/workflows/voice-samples.yml", ".github/workflows/voice-pack.yml", "tools/voice/**", "docs/**", "README.md"]
  pull_request:
  workflow_dispatch:

# Une nouvelle compilation annule la précédente (sinon l'ancienne pourrait être publiée après la nouvelle).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: drive
            tasks: ":app:testDebugUnitTest :app:lintDebug :app:assembleDebug"
            release: ":app:assembleRelease"
          - app: gps
            tasks: ":app:testDebugUnitTest --tests fr.roadguard.app.AverageSpeedZoneMonitorTest :app:assembleDebug"
            release: ":app:assembleRelease"
          - app: suite
            tasks: ":app:assembleDebug"
            release: ":app:assembleRelease"
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Sur l'ordinateur de Nathan (runner gratuit) : SDK Android installé au besoin.
      - uses: android-actions/setup-android@v3
        if: ${{ runner.environment == 'self-hosted' }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Graphe routier embarqué (Franche-Comté)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          mkdir -p gps/app/src/main/assets/graphs
          gh release download graphs -R "${{ github.repository }}" -p 'graph-franche-comte.zip' -D gps/app/src/main/assets/graphs --clobber || echo "Pas encore de graphe publié"
      - name: Modèle de détection de l'assistant caméra (GPS)
        if: ${{ matrix.app == 'gps' }}
        working-directory: .
        run: |
          mkdir -p gps/app/src/main/assets/models
          curl -fsSL --retry 3 -o gps/app/src/main/assets/models/efficientdet_lite0.tflite \
            https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite \
            && ls -la gps/app/src/main/assets/models || echo "::warning::Modèle caméra non téléchargé"
          curl -fsSL --retry 3 -o gps/app/src/main/assets/models/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task \
            || echo "::warning::Modèle visage non téléchargé"
      - name: Compiler et tester
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace ${{ matrix.tasks }}
      - name: Version finale signée (si la phrase de déchiffrement est configurée)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          RG_KEYS_PASSPHRASE: ${{ secrets.RG_KEYS_PASSPHRASE }}
          KEYS_TGZ_ENC: ${{ secrets.KEYS_TGZ_ENC }}
          CLOUDFLARE_ENV_ENC: ${{ secrets.CLOUDFLARE_ENV_ENC }}
          APP: ${{ matrix.app }}
        run: |
          if [ -z "$RG_KEYS_PASSPHRASE" ]; then echo "::warning::Secret RG_KEYS_PASSPHRASE absent : version finale non signée ignorée."; exit 0; fi
          K="$RUNNER_TEMP/keys"; mkdir -p "$K"
          if [ ! -f ../keys/keys.tgz.enc ] && [ -n "$KEYS_TGZ_ENC" ]; then mkdir -p "$(dirname ../keys/keys.tgz.enc)"; printf '%s' "$KEYS_TGZ_ENC" | base64 -d > ../keys/keys.tgz.enc; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../keys/keys.tgz.enc -pass env:RG_KEYS_PASSPHRASE | tar -xzf - -C "$K"
          set -a; . "$K/keys.env"; set +a
          # Pilote Suite est signée avec la clé de l'appli téléphone.
          KEYAPP=$APP; [ "$APP" = suite ] && KEYAPP=gps
          U=$(echo "$KEYAPP" | tr a-z A-Z)
          export RG_KEYSTORE_FILE="$K/roadguard-$KEYAPP.jks"
          export RG_KEYSTORE_PASSWORD="$(eval echo \$${U}_KEYSTORE_PASSWORD)"
          export RG_KEY_PASSWORD="$(eval echo \$${U}_KEY_PASSWORD)"
          export RG_KEY_ALIAS="$(eval echo \$${U}_KEY_ALIAS)"
          export VERSION_CODE=${{ github.run_number }}
          ./gradlew --stacktrace ${{ matrix.release }}
          rm -rf "$K"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-apk-${{ github.run_number }}
          path: |
            ${{ matrix.app }}/app/build/outputs/apk/**/*.apk
            ${{ matrix.app }}/app/build/reports/**
          if-no-files-found: warn
          # Stockage GitHub limité (gratuit) : les APK restent dans les versions, l'artefact ne sert qu'à la publication.
          retention-days: 1

  publish:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publier les APK (branche apk + version GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          for app in drive gps suite; do
            U=$(echo $app | tr a-z A-Z)
            f=$(find art/$app-apk-$RUN -path '*release*' -name '*universal*.apk' | head -1)
            [ -z "$f" ] && f=$(find art/$app-apk-$RUN -path '*release*' -name '*.apk' | head -1)
            [ -z "$f" ] && f=$(find art/$app-apk-$RUN -path '*debug*' -name '*.apk' | head -1)
            [ -n "$f" ] && cp "$f" "dist/ROADGUARD-$U-build$RUN.apk"
            d=$(find art/$app-apk-$RUN -path '*debug*' -name '*.apk' | head -1)
            [ -n "$d" ] && cp "$d" "dist/ROADGUARD-$U-build$RUN-TEST.apk"
          done
          ls -la dist
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cd dist
          git init -q -b apk
          git config user.name "ROADGUARD CI"; git config user.email "ci@roadguard.local"
          git add -A && git commit -qm "APK build $RUN ($SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" apk || echo "::warning::Branche apk non mise à jour (fichier trop gros) : les APK restent dans la version GitHub"
          # Une version GitHub par build ; on n'en garde que 2 (la plus récente et la précédente).
          gh release delete latest -R "$REPO" -y --cleanup-tag || true
          # Passage en public : les anciennes versions (dont l'historique contenait les clés chiffrées) sont retirées
          # et l'étiquette « graphs » est remise sur l'historique nettoyé.
          for old in build-204 build-206 build-207 build-208 build-246 build-247; do gh release delete "$old" -R "$REPO" -y --cleanup-tag 2>/dev/null || gh api -X DELETE "repos/$REPO/git/refs/tags/$old" 2>/dev/null || true; done
          gh api -X PATCH "repos/$REPO/git/refs/tags/graphs" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
          gh release create "build-$RUN" -R "$REPO" --title "ROADGUARD build $RUN" --notes "Compilation automatique de $SHA" *.apk SHA256SUMS.txt
          for tag in $(gh release list -R "$REPO" --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | sort -t- -k2 -n -r | tail -n +3); do
            gh release delete "$tag" -R "$REPO" -y --cleanup-tag || true
          done
      - uses: actions/checkout@v4
        with: { path: src }
      - name: Mise à jour depuis les applis (serveur ROADGUARD)
        env:
          RG_KEYS_PASSPHRASE: ${{ secrets.RG_KEYS_PASSPHRASE }}
          KEYS_TGZ_ENC: ${{ secrets.KEYS_TGZ_ENC }}
          CLOUDFLARE_ENV_ENC: ${{ secrets.CLOUDFLARE_ENV_ENC }}
          RUN: ${{ github.run_number }}
        run: |
          [ -n "$RG_KEYS_PASSPHRASE" ] || exit 0
          if [ ! -f src/keys/cloudflare.env.enc ] && [ -n "$CLOUDFLARE_ENV_ENC" ]; then mkdir -p "$(dirname src/keys/cloudflare.env.enc)"; printf '%s' "$CLOUDFLARE_ENV_ENC" | base64 -d > src/keys/cloudflare.env.enc; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in src/keys/cloudflare.env.enc -pass env:RG_KEYS_PASSPHRASE > "$RUNNER_TEMP/cf.env"
          while IFS='=' read -r k v; do [ -n "$k" ] && echo "::add-mask::$v" && export "$k=$v"; done < "$RUNNER_TEMP/cf.env"
          rm -f "$RUNNER_TEMP/cf.env"
          python3 src/tools/ci/publish_updates.py dist "$RUN" || echo "::warning::Mise à jour en ligne non publiée"
          # Sauvegarde des sources sur le serveur ROADGUARD (en cas de perte du compte GitHub) : 2 gardées.
          git -C src archive --format=zip -o "$RUNNER_TEMP/sources.zip" HEAD
          python3 src/tools/ci/backup_sources.py "$RUNNER_TEMP/sources.zip" "$RUN" "${{ github.sha }}" || echo "::warning::Sauvegarde des sources non faite"
